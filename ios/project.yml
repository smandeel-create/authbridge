name: AuthBridge
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  AuthBridge:
    type: application
    platform: iOS
    sources:
      - ABCrypto.swift
      - Keys.swift
      - API.swift
      - Views.swift
      - AuthBridgeApp.swift
      - Assets.xcassets
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AuthBridge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSFaceIDUsageDescription: AuthBridge uses Face ID to approve each login request on this iPhone.
        NSLocalNetworkUsageDescription: AuthBridge talks to your Mac on the local network or Tailscale to approve logins.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [authbridge]
        # ATS exception justified: the daemon speaks plain HTTP to LAN/Tailscale IPs
        # (no public hostname, so no TLS cert). Every sensitive payload is sealed
        # (X25519 + ChaCha20-Poly1305) and every request is signed by the Secure Enclave key.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AB_BUNDLE_ID)
        PRODUCT_NAME: AuthBridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AuthBridge.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
